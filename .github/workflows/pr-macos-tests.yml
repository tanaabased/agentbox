name: macOS Tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example:
          - inputs
          - defaults
          - tailscale
          - homebrew
          - ssh
          - openclaw
          - rerun
          - users-custom
          - users-existing
          - source
          - sudo
          - codex
          - finalizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run build
            version-injector dist/macos.sh --style sh --version "${{ env.STAMPED_VERSION }}"
      - name: Put prepared agentbox on PATH
        shell: bash
        run: |
          install -m 755 dist/macos.sh dist/agentbox
          echo "$PWD/dist" >> "$GITHUB_PATH"
      - name: Refresh Homebrew metadata
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE='' brew update-if-needed
      - name: Read the OpenClaw CI baseline
        if: matrix.example != 'inputs'
        shell: bash
        run: |
          jq -er '.config.ci.openclaw |
            "OPENCLAW_CI_VERSION=\(.version)\nOPENCLAW_CI_FORMULA_REVISION=\(.homebrewFormulaRevision)"' \
            package.json >> "$GITHUB_ENV"
      - name: Install the OpenClaw CI baseline
        if: matrix.example != 'inputs'
        shell: bash
        run: |
          # Keep the Leia migration on the previous OpenClaw baseline without changing the shipped Brewfile.
          brew tap-new --no-git agentbox/ci
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Homebrew/homebrew-core/$OPENCLAW_CI_FORMULA_REVISION/Formula/o/openclaw-cli.rb" \
            --output "$(brew --repo agentbox/ci)/Formula/openclaw-cli.rb"
          brew install --force-bottle agentbox/ci/openclaw-cli
          brew pin agentbox/ci/openclaw-cli
          "$(brew --prefix)/bin/openclaw" --version | tee /dev/stderr | awk '{print $2}' | grep -Fx "$OPENCLAW_CI_VERSION"
      - name: Run Leia-backed example
        shell: bash
        env:
          AGENTBOX_PAYLOAD_DIR: ${{ github.workspace }}
          AGENTBOX_TAILSCALE_AUTHKEY: ${{ secrets.TANAAB_HOLONET_LOGIN }}
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          mkdir -p "$TMPDIR"
          bun run leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
      - name: Verify the OpenClaw CI baseline was preserved
        if: always() && matrix.example != 'inputs'
        shell: bash
        run: |
          "$(brew --prefix)/bin/openclaw" --version | tee /dev/stderr | awk '{print $2}' | grep -Fx "$OPENCLAW_CI_VERSION"
