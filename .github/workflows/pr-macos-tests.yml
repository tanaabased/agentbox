name: macOS Tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example:
          - inputs
          - defaults
          - tailscale
          - homebrew
          - ssh
          - openclaw
          - rerun
          - users-custom
          - users-existing
          - source
          - sudo
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run build
            version-injector dist/macos.sh --style sh --version "${{ env.STAMPED_VERSION }}"
      - name: Put prepared agentbox on PATH
        shell: bash
        run: |
          install -m 755 dist/macos.sh dist/agentbox
          echo "$PWD/dist" >> "$GITHUB_PATH"
      - name: Run Leia-backed example
        shell: bash
        env:
          AGENTBOX_PAYLOAD_DIR: ${{ github.workspace }}
          AGENTBOX_TAILSCALE_AUTHKEY: ${{ secrets.TANAAB_HOLONET_LOGIN }}
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          brew update
          mkdir -p "$TMPDIR"
          bun run leia "examples/${{ matrix.example }}/README.md" -c "Destroy tests" --stdin --retry 0
