name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify source version alignment
        shell: bash
        run: |
          package_version="$(bun --eval 'const packageJson = JSON.parse(await Bun.file("package.json").text()); console.log(packageJson.version)')"
          plugin_version="$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          printf 'package=%s\nplugin=%s\n' "$package_version" "$plugin_version"
          test "$package_version" = "$plugin_version"
      - name: Prepare release-shaped build
        uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
            bun run lint
            bun run test
            bun run build
            version-injector dist/macos.sh --style sh --version "${{ env.STAMPED_VERSION }}"
      - name: Verify prepared repository
        run: |
          bun run lint
          bun run test
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Verify stamped release entrypoint
        shell: bash
        run: |
          agentbox_version="$(bash ./dist/macos.sh --version)"
          printf 'agentbox=%s\n' "$agentbox_version"
          test "$agentbox_version" = "${{ env.STAMPED_VERSION }}"
      - name: Verify stamped manifests
        shell: bash
        run: |
          package_version="v$(bun --eval 'const packageJson = JSON.parse(await Bun.file("package.json").text()); console.log(packageJson.version)')"
          plugin_version="v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          printf 'package=%s\nplugin=%s\n' "$package_version" "$plugin_version"
          test "$package_version" = "${{ env.STAMPED_VERSION }}"
          test "$plugin_version" = "${{ env.STAMPED_VERSION }}"
      - name: Package release archive
        id: archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/agentbox-${{ env.STAMPED_VERSION }}.tar.gz"
          tar --exclude-vcs --exclude='./node_modules' -czf "$archive" -C "$GITHUB_WORKSPACE" .
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Verify release archive contents
        id: extracted-archive
        env:
          RELEASE_ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          tar -tzf "$RELEASE_ARCHIVE" | grep -F '.codex-plugin/plugin.json'
          tar -tzf "$RELEASE_ARCHIVE" | grep -F 'skills/agentbox/SKILL.md'
          tar -tzf "$RELEASE_ARCHIVE" | grep -F 'scripts/check-plugin-runtime.sh'
          tar -tzf "$RELEASE_ARCHIVE" | grep -F 'dist/macos.sh'
          if tar -tzf "$RELEASE_ARCHIVE" | grep -E '(^|/)node_modules(/|$)'; then
            echo 'release archive must not include node_modules' >&2
            exit 1
          fi
          archive_root="$(mktemp -d)"
          tar -xzf "$RELEASE_ARCHIVE" -C "$archive_root"
          echo "path=$archive_root" >> "$GITHUB_OUTPUT"
      - name: Validate extracted Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.extracted-archive.outputs.path }}
      - name: Pack Codex plugin for npm
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Verify extracted npm package
        id: npm-package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
          EXPECTED_VERSION: ${{ env.STAMPED_VERSION }}
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$package_root"
          package_root="$package_root/package"
          test ! -d "$package_root/node_modules"
          for path in .codex-plugin/plugin.json assets/composer-icon.svg assets/icon-large.png \
            skills/agentbox/SKILL.md skills/agentbox-installer/SKILL.md \
            skills/agentbox-doctor/SKILL.md lib/agentbox-installations.js \
            scripts/check-plugin-runtime.sh \
            skills/agentbox-installer/scripts/manage-installations.js \
            skills/agentbox-doctor/scripts/check-host.js; do
            test -f "$package_root/$path"
          done
          test -x "$package_root/scripts/check-plugin-runtime.sh"
          test -x "$package_root/skills/agentbox-installer/scripts/manage-installations.js"
          test -x "$package_root/skills/agentbox-doctor/scripts/check-host.js"
          PACKAGE_ROOT="$package_root" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const read = file => JSON.parse(fs.readFileSync(path.join(process.env.PACKAGE_ROOT, file)));
            const pkg = read("package.json");
            const plugin = read(".codex-plugin/plugin.json");
            if (pkg.name !== "@tanaab/agentbox" || pkg.private ||
                `v${pkg.version}` !== process.env.EXPECTED_VERSION ||
                pkg.version !== plugin.version) process.exit(1);
          '
          "$package_root/scripts/check-plugin-runtime.sh"
          bun "$package_root/skills/agentbox-installer/scripts/manage-installations.js" --help
          bun "$package_root/skills/agentbox-doctor/scripts/check-host.js" --help
          echo "path=$package_root" >> "$GITHUB_OUTPUT"
      - name: Validate extracted npm Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.npm-package.outputs.path }}
      - name: Dry-run npm publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          dry-run: true
          tarball: ${{ steps.pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: false
