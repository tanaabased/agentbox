name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify source version alignment
        shell: bash
        run: |
          package_version="$(bun --eval 'const packageJson = JSON.parse(await Bun.file("package.json").text()); console.log(packageJson.version)')"
          plugin_version="$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          printf 'package=%s\nplugin=%s\n' "$package_version" "$plugin_version"
          test "$package_version" = "$plugin_version"
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run lint
            bun run build
            version-injector dist/macos.sh --style sh --version "${{ env.STAMPED_VERSION }}"
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
      - name: Verify stamped release entrypoint
        shell: bash
        run: |
          agentbox_version="$(bash ./dist/macos.sh --version)"
          printf 'agentbox=%s\n' "$agentbox_version"
          test "$agentbox_version" = "${{ env.STAMPED_VERSION }}"
      - name: Verify stamped plugin manifest
        shell: bash
        run: |
          plugin_version="v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          printf 'plugin=%s\n' "$plugin_version"
          test "$plugin_version" = "${{ env.STAMPED_VERSION }}"
      - name: Install production dependencies
        run: |
          rm -rf node_modules
          bun install --production --frozen-lockfile --ignore-scripts
      - name: Package release archive
        env:
          RELEASE_ARCHIVE: agentbox-${{ env.STAMPED_VERSION }}.tar.gz
        run: |
          tar \
            --exclude-vcs \
            -czf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" \
            -C "${GITHUB_WORKSPACE}" \
            .
      - name: Generate and verify release archive checksum
        env:
          RELEASE_ARCHIVE: agentbox-${{ env.STAMPED_VERSION }}.tar.gz
        run: |
          cd "${RUNNER_TEMP}"
          shasum -a 256 "${RELEASE_ARCHIVE}" > "${RELEASE_ARCHIVE}.sha256"
          shasum -a 256 -c "${RELEASE_ARCHIVE}.sha256"
      - name: Verify release archive contents
        env:
          RELEASE_ARCHIVE: agentbox-${{ env.STAMPED_VERSION }}.tar.gz
        run: |
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F '.codex-plugin/plugin.json'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F '.mcp.json'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'skills/agentbox-doctor/SKILL.md'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'skills/agentbox-installer/SKILL.md'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'lib/agentbox-installations.js'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'assets/composer-icon.svg'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'assets/icon-large.png'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'dist/macos.sh'
          if tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -E '(^|/)node_modules/(@eslint/js|@lando/leia|eslint|eslint-config-prettier|globals|mocha|prettier|shellcheck)/'; then
            echo 'release archive must not include dev dependencies' >&2
            exit 1
          fi
