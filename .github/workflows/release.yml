name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Export sitemap metadata
        run: echo "SITEMAP_LASTMOD=${{ github.event.release.published_at }}" >> "${GITHUB_ENV}"
      - name: Prepare release
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run lint
            bun run test
            bun run build
            version-injector dist/macos.sh --style sh --version "$PREPARE_RELEASE_VERSION"
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
      - name: Verify prepared repository
        run: |
          bun run lint
          bun run test
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Publish Codex plugin archive
        uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          archive-name: agentbox-${{ github.event.release.tag_name }}.tar.gz
          dependency-policy: include-production
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ github.token }}
