name: Release

on:
  release:
    types:
      - published

jobs:
  publish-repo:
    name: Publish repo
    runs-on: ubuntu-24.04
    env:
      SITEMAP_LASTMOD: ${{ github.event.release.published_at }}
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish repo
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run lint
            bun run test
            bun run build
            version-injector dist/macos.sh --style sh --version "$PREPARE_RELEASE_VERSION"
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-24.04
    env:
      SITEMAP_LASTMOD: ${{ github.event.release.published_at }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
            version-injector dist/macos.sh --style sh --version "$PREPARE_RELEASE_VERSION"
      - name: Validate prepared package
        run: bun run lint
      - name: Pack Codex plugin for npm
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Check extracted npm package
        id: npm-package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
          EXPECTED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$package_root" --strip-components=1
          bun run check:package "$package_root" "$EXPECTED_VERSION"
          echo "path=$package_root" >> "$GITHUB_OUTPUT"
      - name: Validate extracted Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.npm-package.outputs.path }}
      - name: Dry-run npm publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true
          update-prerelease-tag-on-stable: false
      - name: Publish npm
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: false
