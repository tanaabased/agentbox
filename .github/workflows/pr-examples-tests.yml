name: Example Tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example:
          - cli-contract
          - envvars
          - options
          # Add version after the first published agentbox tag exists.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run build
            version-injector dist/boot.sh --style sh --version "${{ env.STAMPED_VERSION }}"
      - name: Put prepared script on PATH
        shell: bash
        run: echo "$PWD/dist" >> "$GITHUB_PATH"
      # - name: Run Leia-backed example
      #   shell: bash
      #   env:
      #     AGENTBOX_TAILSCALE_AUTHKEY: ${{ secrets.TANAAB_HOLONET_LOGIN }}
      #     TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
      #   run: |
      #     mkdir -p "$TMPDIR"
      #     bun run leia "examples/${{ matrix.example }}/README.md" -c "Destroy tests" --stdin

      - name: Debug boot.sh invocation
        shell: bash
        env:
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
          AGENTBOX_TAILSCALE_AUTHKEY: ${{ secrets.TANAAB_HOLONET_LOGIN }}
        run: |
          scripts/cleanup-agentbox-runner.sh
          mkdir -p "$TMPDIR"

          # should generate public key fixtures for option authorized-key installation
          rm -f "$TMPDIR/id_agentbox_options_file" "$TMPDIR/id_agentbox_options_file.pub"
          rm -f "$TMPDIR/id_agentbox_options_raw" "$TMPDIR/id_agentbox_options_raw.pub"
          ssh-keygen -t ed25519 -N "" -C "agentbox-options-file@example.test" -f "$TMPDIR/id_agentbox_options_file" >/dev/null
          ssh-keygen -t ed25519 -N "" -C "agentbox-options-raw@example.test" -f "$TMPDIR/id_agentbox_options_raw" >/dev/null

          # should run boot.sh successfully using options
          boot.sh \
            --force \
            --debug \
            --hostname "TANAABAGENTBOXOPT$GITHUB_RUN_ID" \
            --tailscale-authkey "$AGENTBOX_TAILSCALE_AUTHKEY" \
            --authorized-key "file:$TMPDIR/id_agentbox_options_file.pub" \
            --authorized-key "$(cat "$TMPDIR/id_agentbox_options_raw.pub")"
          test -f "$HOME/tanaab/agentbox/Brewfile"
          command -v tailscale >/dev/null
