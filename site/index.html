<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/unsupported.sh" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentbox bootstrap</title>
    <script>
      const TARGETS = {
        default: '/unsupported.sh',
        macos: '/macos.sh',
        unsupported: '/unsupported.sh',
      };

      function getRedirectTarget(userAgent) {
        if (/Macintosh|Mac OS X|MacIntel|MacPPC/i.test(userAgent)) {
          return TARGETS.macos;
        }

        return TARGETS.unsupported;
      }

      const redirectTarget = getRedirectTarget(window.navigator.userAgent);
      window.location.replace(new URL(redirectTarget, window.location.origin).toString());
    </script>
  </head>
  <body>
    <p>
      Redirecting to <a href="/unsupported.sh">/unsupported.sh</a>. macOS users can use
      <a href="/macos.sh">/macos.sh</a>.
    </p>
  </body>
</html>
